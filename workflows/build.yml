name: Nightly Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Nintendo DS ROM
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:dev-latest
      env:
        BLOCKSDS: /opt/blocksds/core
        PATH: /opt/wonderful/toolchain/gcc-arm-none-eabi/bin:/opt/wonderful/bin:/opt/blocksds/core/tools/ndstool:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Build DSMeteo ROM
        run: |
          make clean || true
          make -j$(nproc)
          ls -la
          cp -v *.nds DSMeteo.nds || true
          ls -lh *.nds

      - name: Upload DSMeteo NDS ROM
        uses: actions/upload-artifact@v4
        with:
          name: DSMeteo-nds
          path: |
            DSMeteo.nds
            *.nds
