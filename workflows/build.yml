name: Nightly Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Nintendo DS ROM
    runs-on: ubuntu-latest
    container:
      image: skylyrac/blocksds:dev-latest
      env:
        PATH: /opt/wonderful/toolchain/gcc-arm-none-eabi/bin:/opt/wonderful/bin:/opt/blocksds/core/tools/ndstool:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        BLOCKSDS: /opt/blocksds/core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build DSMeteo ROM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          make clean || true
          make

      - name: Upload DSMeteo NDS ROM
        uses: actions/upload-artifact@v4
        with:
          name: DSMeteo-nds
          path: DSMeteo.nds
